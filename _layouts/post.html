<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | escape }} | The Plus Side</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <link rel="stylesheet"
        href="{{ '/assets/blog/blog.css' | relative_url }}">

  <link rel="icon" type="image/png"
        href="{{ '/assets/blog/logo-color.png' | relative_url }}">

  <style>
    .article-main {
      max-width: 760px;
      margin: 0 auto;
      padding: 70px 24px 100px;
    }

    .article-back {
      color: var(--purple);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .article-meta {
      margin-top: 50px;
      color: var(--purple);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .article-title {
      font-size: clamp(2.4rem, 6vw, 4.6rem);
      line-height: 1.1;
      letter-spacing: -0.05em;
      margin: 18px 0 26px;
    }

    .article-body {
      font-size: 1.1rem;
      line-height: 1.9;
      overflow-wrap: break-word;
    }

    .article-body h2,
    .article-body h3 {
      line-height: 1.25;
      margin-top: 2em;
    }

    .article-body img,
    .article-body video,
    .article-body iframe {
      max-width: 100%;
    }

    .article-body img {
      height: auto;
      border-radius: 10px;
    }

    .article-body blockquote {
      margin: 30px 0;
      padding-left: 22px;
      border-left: 4px solid var(--terracotta);
      font-style: italic;
    }

    .article-body a {
      color: var(--purple);
    }

    .article-body a:hover {
      color: var(--terracotta);
    }

    .article-end {
      margin-top: 70px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 600px) {
      .article-main {
        padding: 45px 18px 70px;
      }

      .article-body {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="mast">
    <div class="wrap">
      <div class="top">

        <a class="brandmark"
           href="{{ '/blog/' | relative_url }}"
           aria-label="The Plus Side homepage">
          <img
            src="{{ '/assets/blog/logo-color.png' | relative_url }}"
            alt="ss+ symbol">
        </a>

        <a class="back" href="{{ '/' | relative_url }}">
          Back to website ↗
        </a>

      </div>

      <div class="hero" style="padding: 45px 0 55px;">
        <a href="{{ '/blog/' | relative_url }}"
           style="text-decoration: none;">
          <h2 style="font-size: clamp(2rem, 5vw, 3.5rem);
                     margin: 0;
                     letter-spacing: -0.05em;">
            The Plus Side<span class="dot">.</span>
          </h2>
        </a>
      </div>
    </div>
  </header>

  <!-- ARTICLE -->
  <main class="article-main">

    <a class="article-back"
       href="{{ '/blog/' | relative_url }}">
      ← All writing
    </a>

    <div class="article-meta">
      {{ page.category | default: 'Perspectives' | escape }}
      · {{ page.date | date: '%B %-d, %Y' }}
    </div>

    <h1 class="article-title">
      {{ page.title | escape }}
    </h1>

    <article class="article-body">
      {{ content }}
    </article>

    <div class="article-end">
      <a class="article-back"
         href="{{ '/blog/' | relative_url }}">
        ← Back to The Plus Side
      </a>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="foot">
    <div class="wrap">

      <a href="{{ '/' | relative_url }}"
         aria-label="Skilled Services Plus homepage">
        <img
          src="{{ '/assets/blog/logo-cream.png' | relative_url }}"
          alt="ss+ symbol">
      </a>

      <small>
        © {{ 'now' | date: '%Y' }}
        Skilled Services Plus (ss+).
        All rights reserved.
      </small>

    </div>
  </footer>

</body>
</html>
